services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nyaysetu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nyaysetu
    ports:
      - "5432:5432"
    volumes:
      - nyaysetu_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nyaysetu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nyaysetu_pgdata:
